<!DOCTYPE html>
<html>
<head>
    <title>List Books - Part 2</title>
</head>
<body>

<h1>Books List - Part 2 Django Forms</h1>

<a href="{% url 'add_book_lab9_part2' %}">Add New Book</a>

<br><br>

<table border="1">
    <tr>
        <th>ID</th>
        <th>Title</th>
        <th>Author</th>
        <th>Price</th>
        <th>Edition</th>
        <th>Quantity</th>
        <th>Actions</th>
    </tr>

    {% for book in books %}
    <tr>
        <td>{{ book.id }}</td>
        <td>{{ book.title }}</td>
        <td>{{ book.author }}</td>
        <td>{{ book.price }}</td>
        <td>{{ book.edition }}</td>
        <td>{{ book.quantity }}</td>
        <td>
            <a href="{% url 'edit_book_lab9_part2' book.id %}">Edit</a>
            |
            <a href="{% url 'delete_book_lab9_part2' book.id %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr>
        <td colspan="7">No books found.</td>
    </tr>
    {% endfor %}
</table>

</body>
</html>
