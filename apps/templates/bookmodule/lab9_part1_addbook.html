<!DOCTYPE html>
<html>
<head>
    <title>Add Book</title>
</head>
<body>

<h1>Add New Book</h1>

<form method="post">
    {% csrf_token %}

    <label>Title:</label>
    <input type="text" name="title">
    <br><br>

    <label>Author:</label>
    <input type="text" name="author">
    <br><br>

    <label>Price:</label>
    <input type="number" step="0.01" name="price">
    <br><br>

    <label>Edition:</label>
    <input type="number" name="edition">
    <br><br>

    <label>Quantity:</label>
    <input type="number" name="quantity">
    <br><br>

    <button type="submit">Add Book</button>
</form>

<br>

<a href="{% url 'list_books_lab9_part1' %}">Back to Books List</a>

</body>
</html>
